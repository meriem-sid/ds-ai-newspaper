# Source registry for the Data Science & AI Newspaper.
# Edit freely — a feed that fails is logged and skipped; it never breaks the run.

time_windows:
  news_hours: 30        # Bucket A: 24h + slack for cron jitter / timezone skew
  events_days: 7        # Buckets B & C

editorial:
  # Papers are scored in their own LLM batches (not mixed with industry news), and
  # at most this many survive per edition — highest relevance first.
  max_papers: 8
  paper_sources: [arXiv, HF Daily Papers]

# ── Bucket A: Research, Models & Industry News ─────────────────────────────
arxiv:
  enabled: true
  categories: [cs.AI, cs.LG, cs.CV]
  max_results: 60        # arXiv posts hundreds/day; HF Daily Papers is the curated layer
  window_hours: 72       # arXiv announces in batches and skips weekends; seen-dedup prevents repeats

hf_daily_papers:
  enabled: true
  min_upvotes: 5
  window_hours: 48

hackernews:
  enabled: true
  min_points: 50
  # Story titles must match at least one of these (case-insensitive, word-boundary regex)
  keywords:
    - AI
    - LLMs?
    - GPT\S*
    - machine learning
    - deep learning
    - neural
    - transformers?
    - diffusion
    - embeddings?
    - RAG
    - agents?
    - agentic
    - inference
    - fine-?tun\w*
    - Claude
    - Gemini
    - Llama
    - Mistral
    - Qwen
    - DeepSeek
    - OpenAI
    - Anthropic
    - DeepMind
    - Hugging ?Face
    - PyTorch
    - JAX
    - CUDA
    - GPUs?
    - data science
    - data engineering
    - dataset
    - Postgres\w*
    - DuckDB
    - Spark
    - pandas
    - Polars
    - vector (database|search)
    - benchmark
    - reinforcement learning

rss:
  - { name: OpenAI,             url: "https://openai.com/news/rss.xml" }
  - { name: Google DeepMind,    url: "https://deepmind.google/blog/rss.xml" }
  - { name: Google AI,          url: "https://blog.google/technology/ai/rss/" }
  - { name: Google Research,    url: "https://research.google/blog/rss/" }
  - { name: Hugging Face Blog,  url: "https://huggingface.co/blog/feed.xml" }
  - { name: Simon Willison,     url: "https://simonwillison.net/atom/everything/" }
  - { name: Ahead of AI,        url: "https://magazine.sebastianraschka.com/feed" }
  - { name: Import AI,          url: "https://importai.substack.com/feed" }
  # The Batch (deeplearning.ai) has no working RSS feed (all candidate URLs 404 as of 2026-11).
  - { name: BAIR Blog,          url: "https://bair.berkeley.edu/blog/feed.xml" }
  - { name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/" }
  - { name: AWS ML Blog,        url: "https://aws.amazon.com/blogs/machine-learning/feed/" }
  - { name: Data Eng Weekly,    url: "https://www.dataengineeringweekly.com/feed" }
  - { name: Latent Space,       url: "https://www.latent.space/feed" }
  # Anthropic and Meta AI publish no official RSS feed. Their announcements
  # still arrive via Hacker News, Simon Willison, and Import AI; Phase 2 can
  # add a Tavily query for their newsrooms if coverage looks thin.

# ── Bucket B: Hackathons & Competitions ──────────────────────────────────────
kaggle:
  enabled: true          # needs KAGGLE_KEY (new KGAT_ token) or KAGGLE_USERNAME + legacy key
  pages: 1               # 20 most recently created competitions
  window_hours: 720      # 30 days: still-open competitions with real deadlines; seen-dedup stops repeats

# ── Tavily web search (Buckets B + C) ───────────────────────────────────────
# Free tier = 1,000 credits/month; each basic query = 1 credit. 8 queries/day ≈ 240/month.
tavily:
  enabled: true
  max_results: 6
  time_range: week
  exclude_domains: [facebook.com, instagram.com, x.com, twitter.com, youtube.com, tiktok.com, reddit.com, medium.com]
  queries:
    - { bucket: B, category: hackathon, q: "online AI hackathon open for registration" }
    - { bucket: B, category: hackathon, q: "virtual LLM agents hackathon submissions open",
        include_domains: [devpost.com, lablab.ai, cerebralvalley.ai, hackathonhub.eu] }
    - { bucket: B, category: hackathon, q: "data science machine learning competition open",
        include_domains: [drivendata.org, zindi.africa, aicrowd.com, codabench.org], time_range: month }
    - { bucket: C, category: job, q: "remote junior machine learning engineer",
        include_domains: [jobs.ashbyhq.com, jobs.lever.co, boards.greenhouse.io, job-boards.greenhouse.io, apply.workable.com] }
    - { bucket: C, category: job, q: "data science intern 2027 remote",
        include_domains: [jobs.ashbyhq.com, jobs.lever.co, boards.greenhouse.io, job-boards.greenhouse.io, apply.workable.com] }
    - { bucket: C, category: job, q: "entry level data engineer remote",
        include_domains: [jobs.ashbyhq.com, jobs.lever.co, boards.greenhouse.io, job-boards.greenhouse.io, apply.workable.com] }
    - { bucket: C, category: webinar, q: "upcoming online workshop LLM machine learning",
        include_domains: [lu.ma, luma.com, eventbrite.com] }
    - { bucket: C, category: webinar, q: "live event webinar AI developers",
        include_domains: [deeplearning.ai, huggingface.co, lu.ma, luma.com] }

# ── Bucket C: Jobs feeds ────────────────────────────────────────────────────
jobs:
  # A title must match `include` and must NOT match `exclude` (case-insensitive regex).
  include: '\b(data|machine learning|ML|AI|analytics|analyst|scientist|NLP|LLM|MLOps|deep learning|computer vision|python)\b'
  exclude: '\b(senior|sr\.?|staff|principal|lead|director|head|manager|vp|architect|chief)\b'
  remotive:
    enabled: true
    categories: [artificial-intelligence, data]   # be polite: Remotive asks for a few calls/day max
  rss:
    - { name: We Work Remotely, url: "https://weworkremotely.com/categories/remote-programming-jobs.rss" }
    - { name: We Work Remotely, url: "https://weworkremotely.com/remote-jobs.rss" }
