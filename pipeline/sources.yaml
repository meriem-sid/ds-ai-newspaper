  # add a Tavily query for their newsrooms if coverage looks thin.

# ── Bucket B: Hackathons & Competitions ──────────────────────────────────────
kaggle:
  enabled: true          # needs KAGGLE_KEY (new KGAT_ token) or KAGGLE_USERNAME + legacy key
  pages: 1               # 20 most recently created competitions
  window_hours: 720      # 30 days: still-open competitions with real deadlines; seen-dedup stops repeats

# ── Tavily web search (Buckets B + C) ───────────────────────────────────────
# Free tier = 1,000 credits/month; each basic query = 1 credit. 8 queries/day ≈ 240/month.
tavily:
  enabled: true
  max_results: 6
  time_range: week
  exclude_domains: [facebook.com, instagram.com, x.com, twitter.com, youtube.com, tiktok.com, reddit.com, medium.com]
  queries:
    - { bucket: B, category: hackathon, q: "online AI hackathon open for registration" }
    - { bucket: B, category: hackathon, q: "virtual LLM agents hackathon submissions open",
        include_domains: [devpost.com, lablab.ai, cerebralvalley.ai, hackathonhub.eu] }
    - { bucket: B, category: hackathon, q: "data science machine learning competition open",
        include_domains: [drivendata.org, zindi.africa, aicrowd.com, codabench.org], time_range: month }
    - { bucket: C, category: job, q: "remote machine learning engineer",
        include_domains: [jobs.ashbyhq.com, jobs.lever.co, boards.greenhouse.io, job-boards.greenhouse.io, apply.workable.com] }
    - { bucket: C, category: job, q: "remote data scientist OR data science intern",
        include_domains: [jobs.ashbyhq.com, jobs.lever.co, boards.greenhouse.io, job-boards.greenhouse.io, apply.workable.com] }
    - { bucket: C, category: job, q: "remote data engineer OR MLOps engineer",
        include_domains: [jobs.ashbyhq.com, jobs.lever.co, boards.greenhouse.io, job-boards.greenhouse.io, apply.workable.com] }
    - { bucket: C, category: webinar, q: "upcoming online workshop LLM machine learning",
        include_domains: [lu.ma, luma.com, eventbrite.com] }
    - { bucket: C, category: webinar, q: "live event webinar AI developers",
        include_domains: [deeplearning.ai, huggingface.co, lu.ma, luma.com] }

# ── Bucket C: Jobs feeds ────────────────────────────────────────────────────
jobs:
  # A title must match `include` and must NOT match `exclude` (case-insensitive regex).
  include: '\b(data|machine learning|ML|AI|analytics|analyst|scientist|NLP|LLM|MLOps|deep learning|computer vision|python)\b'
  # All seniority levels are kept (entry / mid / senior tabs); only executive roles are filtered out.
  exclude: '\b(director|vp|vice president|head of|chief|cto|ceo)\b'
  remotive:
    enabled: true
    categories: [artificial-intelligence, data]   # be polite: Remotive asks for a few calls/day max
  rss:
    - { name: We Work Remotely, url: "https://weworkremotely.com/categories/remote-programming-jobs.rss" }
    - { name: We Work Remotely, url: "https://weworkremotely.com/remote-jobs.rss" }
