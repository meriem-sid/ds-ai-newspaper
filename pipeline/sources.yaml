# Source registry for the Data Science & AI Newspaper.
# Edit freely — a feed that fails is logged and skipped; it never breaks the run.

time_windows:
  news_hours: 30        # Bucket A: 24h + slack for cron jitter / timezone skew
  events_days: 7        # Buckets B & C

editorial:
  # Papers are scored in their own LLM batches (not mixed with industry news), and
  # at most this many survive per edition — highest relevance first.
  max_papers: 8
  paper_sources: [arXiv, HF Daily Papers]
  # Diversity: at most this many stories from any one source per edition (highest score wins).
  # Papers have their own cap above; jobs and hackathons are distinct opportunities, so they're exempt.
  max_per_source: 2
  cap_exempt_categories: [job, hackathon]

# ── Tools & Resources: open-source tools, models, datasets, benchmarks ───────
resources:
  window_days: 21          # a trending model/repo created up to 3 weeks ago is still news; seen-dedup stops repeats
  hf_models:
    enabled: true
    limit: 30              # trending list size
    readme_top: 10         # fetch the README intro for the top N (the list API has no descriptions)
    min_likes: 20
    # Skip quantised / format re-uploads of the same model
    skip_pattern: '(gguf|awq|gptq|exl2|mlx|fp8|int4|int8|bnb|4bit|8bit|quant)'
  hf_datasets:
    enabled: true
    limit: 20
    min_likes: 10
  github:
    enabled: true          # uses GITHUB_TOKEN when set (Actions provides one); 3–4 searches/day work without it
    topics: [llm, machine-learning, data-engineering, mlops]
    created_within_days: 14
    min_stars: 50
    per_topic: 8
  kaggle_datasets:
    enabled: true
    limit: 15

# ── Bucket A: Research, Models & Industry News ─────────────────────────────
arxiv:
  enabled: true
  categories: [cs.AI, cs.LG, cs.CV]
  max_results: 60        # arXiv posts hundreds/day; HF Daily Papers is the curated layer
  window_hours: 72       # arXiv announces in batches and skips weekends; seen-dedup prevents repeats

hf_daily_papers:
  enabled: true
  min_upvotes: 5
  window_hours: 48

hackernews:
  enabled: true
  min_points: 50
  # Story titles must match at least one of these (case-insensitive, word-boundary regex)
  keywords:
    - AI
    - LLMs?
    - GPT\S*
    - machine learning
    - deep learning
    - neural
    - transformers?
    - diffusion
    - embeddings?
    - RAG
    - agents?
    - agentic
    - inference
    - fine-?tun\w*
    - Claude
    - Gemini
    - Llama
    - Mistral
    - Qwen
    - DeepSeek
    - OpenAI
    - Anthropic
    - DeepMind
    - Hugging ?Face
    - PyTorch
    - JAX
    - CUDA
    - GPUs?
    - data science
    - data engineering
    - dataset
    - Postgres\w*
    - DuckDB
    - Spark
    - pandas
    - Polars
    - vector (database|search)
    - benchmark
    - reinforcement learning

rss:
  - { name: OpenAI,             url: "https://openai.com/news/rss.xml" }
  - { name: Google DeepMind,    url: "https://deepmind.google/blog/rss.xml" }
  - { name: Google AI,          url: "https://blog.google/technology/ai/rss/" }
  - { name: Google Research,    url: "https://research.google/blog/rss/" }
  - { name: Hugging Face Blog,  url: "https://huggingface.co/blog/feed.xml" }
  - { name: Simon Willison,     url: "https://simonwillison.net/atom/everything/" }
  - { name: Ahead of AI,        url: "https://magazine.sebastianraschka.com/feed" }
  - { name: Import AI,          url: "https://importai.substack.com/feed" }
  # The Batch (deeplearning.ai) has no working RSS feed (all candidate URLs 404 as of 2026-11).
  - { name: BAIR Blog,          url: "https://bair.berkeley.edu/blog/feed.xml" }
  - { name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/" }
  - { name: AWS ML Blog,        url: "https://aws.amazon.com/blogs/machine-learning/feed/" }
  - { name: Data Eng Weekly,    url: "https://www.dataengineeringweekly.com/feed" }
  - { name: Latent Space,       url: "https://www.latent.space/feed" }
  # Practitioner & engineering blogs (probed 2026-11: all active in the last 30 days)
  - { name: Eugene Yan,         url: "https://eugeneyan.com/rss/" }
  - { name: Hamel Husain,       url: "https://hamel.dev/index.xml" }
  - { name: Interconnects,      url: "https://www.interconnects.ai/feed" }
  - { name: MIT Tech Review AI, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed" }
  - { name: NVIDIA Tech Blog,   url: "https://developer.nvidia.com/blog/feed" }
  - { name: Databricks Blog,    url: "https://www.databricks.com/feed" }
  - { name: KDnuggets,          url: "https://www.kdnuggets.com/feed" }
  - { name: Mozilla.ai,         url: "https://blog.mozilla.ai/rss/" }
  - { name: Apple ML Research,  url: "https://machinelearning.apple.com/rss.xml" }
  - { name: Meta Engineering,   url: "https://engineering.fb.com/feed/" }
